location = /music {
	return 301 /music/;
}
location ~ "^/music/media/([a-f0-9]{64}\.mp3)$" {
	alias /var/www/capwise/music-media/$1;
	include /var/www/capwise/capwise-headers.conf;
	add_header Cache-Control "public, max-age=31536000, immutable";
}
location /music/media/ {
	return 404;
}
location /music/ {
	root /var/www/capwise/music-current;
	include /var/www/capwise/capwise-headers.conf;
	add_header Cache-Control "no-cache" always;
	try_files $uri $uri/ =404;
}

name: Capwise platform candidates

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: all
        options:
          - all
          - mac-intel
          - linux-x64
          - windows-x64
      mac_candidate_run:
        description: Workflow run with an existing Intel Mac app candidate
        required: false
        type: string
      linux_candidate_run:
        description: Workflow run with an existing Linux package candidate
        required: false
        type: string
  pull_request:
    types: [opened, reopened]
    paths:
      - .github/workflows/capwise-platform-build.yml
      - apps/desktop-gpui/scripts/fetch-llama-server.sh
      - apps/desktop-gpui/scripts/release.sh

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: inputs.linux_candidate_run == '' && inputs.mac_candidate_run == ''
    name: ${{ matrix.platform }}
    runs-on: ${{ fromJSON('{"mac-intel":"macos-15-intel","linux-x64":"ubuntu-24.04","windows-x64":"windows-2022"}')[matrix.platform] }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ inputs.platform && inputs.platform != 'all' && fromJSON(format('["{0}"]', inputs.platform)) || fromJSON('["mac-intel","linux-x64","windows-x64"]') }}
    env:
      RUST_TARGET_TRIPLE: ${{ fromJSON('{"mac-intel":"x86_64-apple-darwin","linux-x64":"x86_64-unknown-linux-gnu","windows-x64":"x86_64-pc-windows-msvc"}')[matrix.platform] }}
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Select a reachable Ubuntu package mirror
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for mirror in https://archive.ubuntu.com/ubuntu https://mirrors.mit.edu/ubuntu https://mirrors.edge.kernel.org/ubuntu; do
            if curl -fsSL --max-time 15 "$mirror/dists/noble/InRelease" -o /dev/null &&
               curl -fsSL --max-time 15 "$mirror/dists/noble-security/InRelease" -o /dev/null; then
              sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<EOF
          Types: deb
          URIs: $mirror
          Suites: noble noble-updates noble-backports noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
              exit 0
            fi
          done
          exit 1

      - uses: ./.github/actions/install-desktop-deps
        if: runner.os == 'Linux'
        timeout-minutes: 12

      - uses: oven-sh/setup-bun@v2
        if: runner.os != 'macOS'
        with:
          bun-version: 1.4.4

      - name: Prepare GPUI and Rust toolchain
        shell: bash
        run: |
          scripts/prepare-gpui-dependency.sh
          if [[ "$RUNNER_OS" != "macOS" ]]; then node scripts/sync-desktop-versions.mjs; fi
          rustup toolchain install 1.95.0 --profile minimal

      - name: Install desktop bundler
        if: runner.os != 'macOS'
        shell: bash
        run: bun install --frozen-lockfile --filter @cap/desktop

      - name: Cache release builds
        uses: ./.github/actions/setup-rust-cache
        with:
          target: ${{ env.RUST_TARGET_TRIPLE }}
          prefix-key: capwise-platform-release-v1
          save-cache: "true"
          cache-on-failure: "true"
          workspaces: |
            . -> target
            apps/desktop-gpui -> target

      - name: Prepare native dependencies after restoring the Rust cache
        shell: bash
        run: node scripts/setup.js

      - name: Package Intel Mac candidate
        if: runner.os == 'macOS'
        shell: bash
        env:
          CAPWISE_ICON_DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: |
          brew install minisign
          DEVELOPER_DIR="$CAPWISE_ICON_DEVELOPER_DIR" xcodebuild -version
          icon_test="$(mktemp -d "$RUNNER_TEMP/capwise-icon.XXXXXX")"
          DEVELOPER_DIR="$CAPWISE_ICON_DEVELOPER_DIR" xcrun actool apps/desktop-gpui/packaging/macos/AppIcon.icon \
            --compile "$icon_test" --platform macosx --minimum-deployment-target 13.0 --app-icon AppIcon \
            --target-device mac --output-partial-info-plist "$icon_test/Info.plist"
          test -s "$icon_test/Assets.car"
          test -s "$icon_test/AppIcon.icns"
          version="$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"/\1/p' apps/desktop-gpui/Cargo.toml)"
          export MACOSX_DEPLOYMENT_TARGET=13.3
          cargo build --release --locked -p cap
          cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --release --locked --bin cap-gpui
          DEVELOPER_DIR="$CAPWISE_ICON_DEVELOPER_DIR" \
            apps/desktop-gpui/scripts/release.sh "$version" --dry-run --app-only --skip-build
          archive="apps/desktop-gpui/target/release-candidate/$version/Capwise_${version}_x86_64.app.tar.gz"
          mkdir -p candidate
          cp "$archive" candidate/

      - name: Build sidecars
        if: runner.os != 'macOS'
        shell: bash
        run: scripts/build-desktop-binaries.sh "$RUST_TARGET_TRIPLE"

      - name: Package Linux candidate
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node scripts/bundle-gpui.mjs "$RUST_TARGET_TRIPLE" --bundles deb \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
          debs=(apps/desktop-gpui/target/"$RUST_TARGET_TRIPLE"/release/bundle/deb/*.deb)
          test "${#debs[@]}" -eq 1
          node scripts/finalize-linux-gpui-packages.mjs --unsigned "${debs[0]}"
          mkdir -p candidate
          apps/desktop-gpui/scripts/package-capwise-deb.sh "${debs[0]}" candidate/Capwise-linux-x86_64.deb
          apps/desktop-gpui/scripts/verify-capwise-deb.sh candidate/Capwise-linux-x86_64.deb

      - name: Package Windows candidate
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node scripts/bundle-gpui.mjs "$RUST_TARGET_TRIPLE" --no-bundle
          node --input-type=module -e 'import {writePlatformConfig} from "./scripts/bundle-gpui.mjs"; await writePlatformConfig("win32");'
          cd apps/desktop-gpui
          output="target/$RUST_TARGET_TRIPLE/release"
          mv "$output/Cap.exe" "$output/Capwise.exe"
          TAURI_APP_PATH="$(pwd -W)" RUSTUP_TOOLCHAIN=1.95.0 bun run tauri bundle \
            --target "$RUST_TARGET_TRIPLE" --bundles nsis --config packaging/windows/capwise-preview.json
          installers=("$output"/bundle/nsis/*.exe)
          test "${#installers[@]}" -eq 1
          mkdir -p ../../candidate
          cp "${installers[0]}" ../../candidate/Capwise-Windows-x64-Setup.exe

      - name: Verify Windows credentials and adapter selection
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo test --locked -p cap-utils --lib windows_credentials
          cargo test --locked -p cap-d3d-adapter --lib

      - name: Verify installed Windows candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path apps/desktop-gpui/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          ./apps/desktop-gpui/scripts/verify-capwise-windows.ps1 -Installer candidate/Capwise-Windows-x64-Setup.exe -Version $version

      - name: Record candidate provenance
        shell: bash
        run: |
          git rev-parse HEAD > candidate/SOURCE_COMMIT
          git rev-parse 'HEAD^{tree}' > candidate/SOURCE_TREE
          cd candidate
          if command -v sha256sum >/dev/null; then
            sha256sum ./* > ../candidate-shasums.txt
          else
            shasum -a 256 ./* > ../candidate-shasums.txt
          fi
          mv ../candidate-shasums.txt SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: capwise-${{ matrix.platform }}
          path: candidate/
          if-no-files-found: error

      - name: Verify archived Intel Mac candidate
        if: runner.os == 'macOS'
        shell: bash
        run: |
          archives=(candidate/*.app.tar.gz)
          test "${#archives[@]}" -eq 1
          extracted="$(mktemp -d "$RUNNER_TEMP/capwise-app.XXXXXX")"
          tar -xzf "${archives[0]}" -C "$extracted"
          apps/desktop-gpui/scripts/verify-capwise-mac.sh "$extracted/Capwise.app"

  linux-repackage:
    if: inputs.linux_candidate_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: capwise-linux-x64
          path: incoming/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.linux_candidate_run }}

      - name: Package and verify Capwise for Ubuntu
        run: |
          debs=(incoming/*.deb)
          test "${#debs[@]}" -eq 1
          mkdir -p candidate
          if [[ "$(dpkg-deb -f "${debs[0]}" Package)" == capwise ]]; then
            cp "${debs[0]}" candidate/Capwise-linux-x86_64.deb
          else
            apps/desktop-gpui/scripts/package-capwise-deb.sh "${debs[0]}" candidate/Capwise-linux-x86_64.deb
          fi
          apps/desktop-gpui/scripts/verify-capwise-deb.sh candidate/Capwise-linux-x86_64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: capwise-linux-x64
          path: candidate/
          if-no-files-found: error

  mac-verify:
    if: inputs.mac_candidate_run != ''
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: capwise-mac-intel
          path: incoming/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.mac_candidate_run }}

      - name: Launch the Intel Mac package
        run: |
          archives=(incoming/*.app.tar.gz)
          test "${#archives[@]}" -eq 1
          tar -xzf "${archives[0]}"
          apps/desktop-gpui/scripts/verify-capwise-mac.sh Capwise.app
